
name: Build TripReader APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip TripReaderAndroid_cloudbuild.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          p = 'tmp/TripReaderAndroid/app/build.gradle'
          s = open(p).read()
          s = s.replace(
              '    buildFeatures { viewBinding true }',
              """    compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { viewBinding true }"""
          )
          open(p, 'w').write(s)
          PY

      - name: Build APK
        run: |
          cd tmp/TripReaderAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TripReader-APK
          path: tmp/TripReaderAndroid/app/build/outputs/apk/debug/app-debug.apk
